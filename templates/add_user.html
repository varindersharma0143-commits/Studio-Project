{% extends "base.html" %}

{% block title %}
Add User
{% endblock %}

{% block body %}

<style>

    .add-user-page {
        min-height: 80vh;
        padding: 50px 20px;
        background: #f5f7fb;
    }

    .add-user-container {
        max-width: 650px;
        margin: auto;
    }

    .add-user-card {
        background: white;
        border-radius: 18px;
        padding: 35px;
        box-shadow: 0 10px 35px rgba(0,0,0,0.10);
    }

    .add-user-header {
        text-align: center;
        margin-bottom: 30px;
    }

    .add-user-header .icon {
        width: 70px;
        height: 70px;
        border-radius: 50%;
        background: #111827;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: auto;
        font-size: 30px;
    }

    .add-user-header h2 {
        margin-top: 18px;
        margin-bottom: 5px;
        font-weight: 700;
        color: #111827;
    }

    .add-user-header p {
        color: #6b7280;
        margin: 0;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 7px;
        font-weight: 600;
        color: #374151;
    }

    .form-control {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 15px;
        box-sizing: border-box;
    }

    .form-control:focus {
        outline: none;
        border-color: #111827;
        box-shadow: 0 0 0 3px rgba(17,24,39,0.10);
    }

    select.form-control {
        background: white;
    }

    .password-wrapper {
        position: relative;
    }

    .password-wrapper .form-control {
        padding-right: 50px;
    }

    .show-password {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        border: none;
        background: transparent;
        cursor: pointer;
        font-size: 18px;
    }

    .button-area {
        display: flex;
        gap: 12px;
        margin-top: 30px;
    }

    .btn-save {
        flex: 1;
        padding: 13px;
        border: none;
        border-radius: 8px;
        background: #111827;
        color: white;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
    }

    .btn-save:hover {
        background: #374151;
    }

    .btn-cancel {
        flex: 1;
        padding: 13px;
        border-radius: 8px;
        background: #e5e7eb;
        color: #374151;
        text-decoration: none;
        text-align: center;
        font-weight: 600;
    }

    .btn-cancel:hover {
        background: #d1d5db;
        color: #111827;
    }

    .info-box {
        margin-top: 25px;
        padding: 14px;
        border-radius: 8px;
        background: #f3f4f6;
        color: #4b5563;
        font-size: 13px;
    }

    @media(max-width:600px) {

        .add-user-page {
            padding: 25px 10px;
        }

        .add-user-card {
            padding: 25px 20px;
        }

        .button-area {
            flex-direction: column;
        }

    }

</style>


<div class="add-user-page">

    <div class="add-user-container">

        <div class="add-user-card">

            <!-- Header -->

            <div class="add-user-header">

                <div class="icon">
                    👤
                </div>

                <h2>Add New User</h2>

                <p>
                    Create a new user account
                </p>

            </div>


            <!-- Form -->

            <form method="POST"
                  action="{{ url_for('add_user') }}">

                <!-- Username -->

                <div class="form-group">

                    <label>
                        Username
                    </label>

                    <input type="text"
                           name="username"
                           class="form-control"
                           placeholder="Enter username"
                           required>
                </div>
                <!-- Email -->

                <div class="form-group">

                    <label>
                        Email Address
                    </label>

                    <input type="email"
                           name="email"
                           class="form-control"
                           placeholder="Enter email address"
                           required>
                </div>
                <!-- Password -->
                <div class="form-group">
                    <label>
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input type="password"
                               name="password"
                               id="password"
                               class="form-control"
                               placeholder="Enter password"
                               required>

                        <button type="button"
                                class="show-password"
                                onclick="togglePassword()">
                            👁
                        </button>
                    </div>
                </div>


                <!-- Role -->

                <div class="form-group">
                    <label>
                        User Role
                    </label>
                    <select name="role"
                            class="form-control"
                            required>
                        <option value="User">
                            User
                        </option>
                        <option value="Admin">
                            Admin
                        </option>
                    </select>

                </div>

                <!-- Buttons -->
                <div class="button-area">
                    <a href="{{ url_for('admin_users') }}"
                         class="btn-cancel">
                         Cancel
                 </a>

                    <button type="submit"
                            class="btn-save">
                        ➕ Add User
                    </button>
                </div>
            </form>
            <div class="info-box">
                <strong>Note:</strong>
                Admin users can access the administrator dashboard.
                Normal users cannot access admin pages.
            </div>
        </div>
    </div>
</div>


<script>
function togglePassword() {
    const password = document.getElementById("password");
    if (password.type === "password") {
        password.type = "text";
    } else {
        password.type = "password";
    }
}
</script>

{% endblock body %}

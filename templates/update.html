
{% extends 'base.html' %}
{% block title %} Home {% endblock title %}
{% block body %} 


  <div class="container">
    <h2>Update Todos</h2>
   <form action="/update/{{todo.sno}}" method="POST">
  <div class="mb-3">
    <label for="title" class="form-label">Todo Title</label>
    <input type="text" class="form-control" value="{{todo.title}}" name="title" id="title" aria-describedby="emailHelp">
    
  </div>
  <div class="mb-3">
    <label for="desc" class="form-label">Todo Descption</label>
    <input type="text" class="form-control" value="{{todo.desc}}" name="desc" id="desc">
  </div>

  <button type="submit" class="btn btn-outline-dark">Update</button>
</form>





  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>


    {% endblock body %}
